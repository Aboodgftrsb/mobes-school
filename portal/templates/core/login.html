{% extends 'core/base.html' %}
{% block title %}تسجيل الدخول{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
  <h1 class="text-xl font-semibold mb-4">تسجيل الدخول</h1>
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div>
      <label class="block mb-1">اسم المستخدم</label>
      {{ form.username }}
    </div>
    <div>
      <label class="block mb-1">كلمة المرور</label>
      {{ form.password }}
    </div>
    <button class="w-full bg-blue-600 text-white py-2 rounded">دخول</button>
  </form>
</div>
{% endblock %}
